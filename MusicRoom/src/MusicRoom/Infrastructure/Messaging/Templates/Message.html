<!doctype html>
<html lang="{{lang}}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="supported-color-schemes" content="light dark" />
    <title>{{subject}}</title>
    <style>
      /* One layout for every message — SPEC-052. Black on white, 21:1 contrast either way, and a dark
         variant for clients that honour it. Inline styles do the work, because a mail client may drop
         this block entirely; what is here is the part that cannot be inlined. */
      :root { color-scheme: light dark; }

      @media (prefers-color-scheme: dark) {
        .surface { background: #000000 !important; }
        .card { background: #0a0a0a !important; border-color: #2b2b2b !important; }
        .ink { color: #ffffff !important; }
        .muted { color: #b4b4b4 !important; }
        .action { background: #ffffff !important; color: #000000 !important; }
        .code { background: #141414 !important; color: #ffffff !important; border-color: #3a3a3a !important; }
      }

      /* A visible focus ring: a keyboard reader has to be able to see where they are — WCAG 2.4.7. */
      a:focus { outline: 3px solid currentColor; outline-offset: 3px; }

      @media (max-width: 480px) {
        .card { padding: 24px !important; }
        .code { font-size: 28px !important; letter-spacing: 6px !important; }
      }
    </style>
  </head>

  <body class="surface" style="margin:0; padding:0; background:#ffffff;">
    <!-- The preheader: what a mail client shows beside the subject. Hidden in the body itself, and never
         the code — a preview pane is read over somebody's shoulder. -->
    <div style="display:none; max-height:0; overflow:hidden; opacity:0;">{{preheader}}</div>

    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
           style="background:#ffffff;">
      <tr>
        <td align="center" style="padding:32px 16px;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
                 style="max-width:560px;">
            <tr>
              <td class="card"
                  style="background:#ffffff; border:1px solid #e6e6e6; border-radius:16px; padding:40px;
                         font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,
                         sans-serif;">

                <p class="ink"
                   style="margin:0 0 32px; font-size:14px; font-weight:700; letter-spacing:2px;
                          text-transform:uppercase; color:#000000;">Music Room</p>

                <h1 class="ink"
                    style="margin:0 0 16px; font-size:26px; line-height:1.25; font-weight:700;
                           color:#000000;">{{heading}}</h1>

                <p class="ink" style="margin:0 0 8px; font-size:16px; line-height:1.6; color:#000000;">
                  {{greeting}}
                </p>

                <p class="muted" style="margin:0 0 28px; font-size:16px; line-height:1.6; color:#444444;">
                  {{explanation}}
                </p>

                {{body}}

                <hr style="border:none; border-top:1px solid #e6e6e6; margin:32px 0;" />

                <p class="muted" style="margin:0 0 8px; font-size:14px; line-height:1.6; color:#444444;">
                  {{footer}}
                </p>

                <p class="muted" style="margin:0; font-size:13px; line-height:1.6; color:#6b6b6b;">
                  Music Room · École 42
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
