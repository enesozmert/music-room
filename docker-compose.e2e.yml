# The end-to-end overlay — SPEC-046.
#
# `make e2e` composes this on top of docker-compose.yml so the smoke test drives a stack that is the
# real one in every way that matters — real Kestrel, real PostgreSQL, real HTTP over a port — and
# differs in exactly three, each of which would otherwise make the run either impossible or harmful.
#
# No credential is written here either. The signing key arrives through the shell from
# `make e2e`, which generates one and throws it away.

services:
  api:
    environment:
      # 1. The logging sender, so a smoke run sends nobody an email. The real sender is proven by
      #    SPEC-024's own tests; a check that posted to Brevo on every run would bounce mail at
      #    example.com addresses and spend the project's sender reputation to prove nothing new.
      #    This sender is refused outside Development by the start-up guard, which is the point.
      MAIL_PROVIDER: logging
      MAIL_FROM: e2e@musicroom.invalid
      MAIL_FROM_NAME: MusicRoom end-to-end

      # 2. A client row, so the authorization code flow has somebody to issue a code to — SPEC-044.
      #    Here rather than in .env because it belongs to this check, not to the owner's machine.
      OIDC_CLIENT_ID: musicroom-e2e
      OIDC_CLIENT_REDIRECT_URIS: https://e2e.musicroom.invalid/callback

      # 3. A throwaway RS256 key, generated by `make e2e` and gone when the run ends. A fixed key in
      #    this file would be a private key in a public repository, and a key in .env would make a
      #    smoke test a prerequisite for the owner's own stack.
      OIDC_SIGNING_KEY: ${OIDC_SIGNING_KEY:?make e2e generates this; run the check through it}
