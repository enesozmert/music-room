# Keep docs/progress/PROGRESS.json true on main, automatically.
#
# The snapshot is counted from the repository, so every merge can move it. Regenerating it by hand
# means it is right on the day someone remembers and wrong afterwards — which is exactly the kind
# of claim docs/SDD.md section 16 is not allowed to make.
#
# This job only ever writes the snapshot. It never touches a document a human wrote, and it cannot
# push to main: the branch is protected with enforce_admins, so the refresh arrives as a pull
# request on one fixed branch that is force-pushed rather than one branch per merge.

name: progress

on:
  push:
    branches:
      - main
    paths:
      - "docs/DELIVERY-PLAN.md"
      - "docs/SDD.md"
      - "docs/api/ENDPOINTS.md"
      - "docs/specs/**"
      - "brain/decisions/decisions-index.md"
      - "MusicRoom/**"
      - ".agent/progress.sh"
      - ".github/workflows/progress.yml"
  workflow_dispatch:

# No pull-requests: write. This job deliberately does not open the pull request — see the step.
permissions:
  contents: write

concurrency:
  group: progress-main
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SNAPSHOT_BRANCH: chore/progress-snapshot
    steps:
      - uses: actions/checkout@v4

      - name: Count
        run: ./.agent/progress.sh --write

      - name: Write the numbers into the run summary
        run: |
          {
            echo '## Backend progress'
            echo
            echo '```'
            ./.agent/progress.sh
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The pull request is opened by a person, or by /progress, and never by this job.
      # A pull request opened with GITHUB_TOKEN does not trigger workflow runs, so `gate` never
      # starts on it, and `gate` is a required check on main: the result is a pull request that
      # is blocked forever and cannot be rescued. #43 was exactly that. Pushing the branch is
      # the part a job can do correctly.
      - name: Refresh the snapshot branch
        run: |
          if git diff --quiet -- docs/progress/PROGRESS.json; then
            echo "snapshot unchanged; nothing to push." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # main is protected and enforce_admins is on, so this job cannot push to it and should
          # not be able to. It keeps ONE branch instead, force-pushed, so the refresh is always a
          # single pull request rather than one per merge.
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$SNAPSHOT_BRANCH"
          git add docs/progress/PROGRESS.json
          git commit -q -m "chore(progress): refresh the snapshot

          Counted by .agent/progress.sh on ${GITHUB_SHA:0:7}. Generated file, no judgement in it.
          The two values the script cannot count are read from columns: the slice State in
          docs/DELIVERY-PLAN.md and Lands in in brain/decisions/decisions-index.md."
          git push --force origin "$SNAPSHOT_BRANCH"

          {
            echo
            echo "Pushed \`$SNAPSHOT_BRANCH\`. Open the pull request here:"
            echo
            echo "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/main...$SNAPSHOT_BRANCH?expand=1"
          } >> "$GITHUB_STEP_SUMMARY"
