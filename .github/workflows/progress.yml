# Keep docs/progress/PROGRESS.json true on main, automatically.
#
# The snapshot is counted from the repository, so every merge can move it. Regenerating it by hand
# means it is right on the day someone remembers and wrong afterwards — which is exactly the kind
# of claim docs/SDD.md section 16 is not allowed to make.
#
# This job only ever writes the snapshot. It never touches a document a human wrote, and it cannot
# push to main: the branch is protected with enforce_admins, so the refresh arrives as a pull
# request on one fixed branch that is force-pushed rather than one branch per merge.

name: progress

on:
  push:
    branches:
      - main
    paths:
      - "docs/DELIVERY-PLAN.md"
      - "docs/SDD.md"
      - "docs/api/ENDPOINTS.md"
      - "docs/specs/**"
      - "brain/decisions/decisions-index.md"
      - "MusicRoom/**"
      - ".agent/progress.sh"
      - ".github/workflows/progress.yml"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: progress-main
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SNAPSHOT_BRANCH: chore/progress-snapshot
    steps:
      - uses: actions/checkout@v4

      - name: Count
        run: ./.agent/progress.sh --write

      - name: Open or refresh the snapshot pull request
        run: |
          if git diff --quiet -- docs/progress/PROGRESS.json; then
            echo "snapshot unchanged."
            exit 0
          fi

          # main is protected and enforce_admins is on, so this job cannot push to it and should
          # not be able to. It keeps ONE branch instead, force-pushed, so the refresh is always a
          # single open pull request rather than one per merge.
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$SNAPSHOT_BRANCH"
          git add docs/progress/PROGRESS.json
          git commit -m "chore(progress): refresh the snapshot

          Counted by .agent/progress.sh on ${GITHUB_SHA:0:7}. Generated file, no judgement in it.
          The two values the script cannot count are read from columns: the slice State in
          docs/DELIVERY-PLAN.md and Lands in in brain/decisions/decisions-index.md."
          git push --force origin "$SNAPSHOT_BRANCH"

          if [ -z "$(gh pr list --head "$SNAPSHOT_BRANCH" --state open --json number -q '.[].number')" ]; then
            gh pr create \
              --base main \
              --head "$SNAPSHOT_BRANCH" \
              --title "chore(progress): refresh the progress snapshot" \
              --body "\`docs/progress/PROGRESS.json\` recounted by \`.agent/progress.sh\`. Generated file; the numbers move when the plan, the SDD, the endpoint inventory, the specs, the decision log or \`MusicRoom/\` move.

          This branch is force-pushed on every qualifying merge, so there is at most one of these open at a time. Merging it refreshes what \`/progress\` publishes to the board.

          Two values are read rather than counted, and a wrong one here means a wrong column there: the slice \`State\` in \`docs/DELIVERY-PLAN.md\` and \`Lands in\` in \`brain/decisions/decisions-index.md\`."
          else
            echo "pull request already open; the force-push refreshed it."
          fi
