# Backend CI — prod configuration. Subject V.8, ADR-0015.
# Release build, plus proof that the image compose runs is buildable.
# It does NOT deploy and it does NOT push: the deployment target is a deferred ADR.

name: backend-prod

on:
  push:
    branches:
      - main
    paths:
      - "MusicRoom/**"
      - ".github/workflows/backend-*.yml"
      - "Makefile"
      - "docker-compose.yml"

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: "true"
      BUILD_CONFIGURATION: Release

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore MusicRoom/MusicRoom.sln

      - name: Format
        run: dotnet format MusicRoom/MusicRoom.sln --verify-no-changes

      - name: Build
        run: dotnet build MusicRoom/MusicRoom.sln -c ${{ env.BUILD_CONFIGURATION }} -warnaserror --no-restore

      - name: Test
        run: dotnet test --solution MusicRoom/MusicRoom.sln -c ${{ env.BUILD_CONFIGURATION }} --no-build --verbosity normal

      - name: Vulnerable packages
        run: |
          dotnet list MusicRoom/MusicRoom.sln package --vulnerable --include-transitive \
            > vulnerable.txt 2>&1
          cat vulnerable.txt
          if grep -qiE '\|\s*High|\|\s*Critical' vulnerable.txt; then
            echo "::error::High or critical severity advisory in the dependency tree"
            exit 1
          fi

      # openapi-documentation: the committed document must match the code that generated it.
      # Through `make openapi`, so the environment the generator needs is defined in exactly one place —
      # issue O30. The generator boots the real host, so every start-up requirement has to be satisfied,
      # and three copies of that list diverge the first time one grows: SPEC-043 added OIDC_SIGNING_KEY to
      # the Makefile, the local gate passed, and this workflow failed because it carried its own copy.
      # SPEC-024's mail guard and SPEC-005's JWT settings had already done the same thing twice.
      #
      # `--no-restore` because the Restore step above already did it. Everything else — the placeholder
      # connection string, the placeholder JWT settings, the logging mail sender and the generated RS256
      # key that is thrown away — is in the Makefile, with the comment explaining why each is safe here.
      - name: OpenAPI document is current
        run: |
          make openapi OPENAPI_BUILD_FLAGS=--no-restore
          git diff --exit-code -- docs/api/openapi.json

      # Proven buildable, never pushed. No registry and no token exist yet — ADR-0015.
      - name: Container image builds
        run: docker build -f MusicRoom/Dockerfile MusicRoom
