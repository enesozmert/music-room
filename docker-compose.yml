# Local runtime — ci-cd-containerization, ADR-0026.
# S0 to S3 run against the `db` service below. S4 onward points DATABASE_URL at Supabase and this
# service stays for Testcontainers and offline work. Same engine, same migrations.
#
# No credential is written in this file. Every value comes from .env, which is git-ignored.

services:
  db:
    image: postgres:18.2-alpine
    env_file:
      - .env

    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      # Host port is configurable: a fixed 5432 collides with any other project already running
      # PostgreSQL on this machine. The container port never changes, so DATABASE_URL inside the
      # compose network is unaffected.
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./MusicRoom
      dockerfile: Dockerfile
    env_file:
      - .env

    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      # Vendor-neutral by design — ADR-0026. Inside the compose network the host is `db`, so the
      # .env value, which names localhost for `dotnet ef` on the host, is rewritten here.
      DATABASE_URL: Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      OTEL_EXPORTER_ENABLED: ${OTEL_EXPORTER_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  # --- The vault, behind a profile ----------------------------------------------------------------
  #
  # `docker compose up` does not start these. `docker compose --profile vault up -d` does, and
  # `make vault` is the same command spelled once — SPEC-042, ADR-0029.
  #
  # Behind a profile because the ADR said the cost out loud before it was paid: "self-hosted
  # Infisical is not one container... the compose stack grows from two services to roughly five, and
  # each is something that can fail during a defence demo". The two services a demo needs stay two.
  #
  # Its own PostgreSQL, not the application's. Sharing one would put the secret store and the user
  # data behind a single backup, a single migration and a single failure.
  #
  # The four secrets below default to empty rather than using a `:?` guard, and `make vault` refuses
  # a blank one instead. Compose interpolates **every** service's variables even when the profile is
  # off, so a guard here made `make up` fail for anyone who had not filled in a vault they were not
  # starting — found by running `docker compose config` before this file was committed.

  infisical-db:
    profiles: ["vault"]
    image: postgres:18.2-alpine
    environment:
      POSTGRES_USER: ${INFISICAL_DB_USER:-infisical}
      POSTGRES_PASSWORD: ${INFISICAL_DB_PASSWORD:-}
      POSTGRES_DB: ${INFISICAL_DB_NAME:-infisical}
    volumes:
      - infisical-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  infisical-redis:
    profiles: ["vault"]
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${INFISICAL_REDIS_PASSWORD:-}"]
    volumes:
      - infisical-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD:-$$INFISICAL_REDIS_PASSWORD} ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      INFISICAL_REDIS_PASSWORD: ${INFISICAL_REDIS_PASSWORD}

  infisical:
    profiles: ["vault"]
    image: infisical/infisical:latest-postgres
    environment:
      # Generated once by the owner and kept in .env — `openssl rand -hex 16` and
      # `openssl rand -base64 32`. Losing ENCRYPTION_KEY loses every secret in the vault.
      ENCRYPTION_KEY: ${INFISICAL_ENCRYPTION_KEY:-}
      AUTH_SECRET: ${INFISICAL_AUTH_SECRET:-}

      # 8090, not 8080: the API already holds that port, and a vault that cannot start because the
      # thing it serves is already listening is a bad first impression.
      SITE_URL: ${INFISICAL_SITE_URL:-http://localhost:8090}

      DB_CONNECTION_URI: postgres://${INFISICAL_DB_USER:-infisical}:${INFISICAL_DB_PASSWORD}@infisical-db:5432/${INFISICAL_DB_NAME:-infisical}
      REDIS_URL: redis://default:${INFISICAL_REDIS_PASSWORD}@infisical-redis:6379

      # No telemetry from a development machine.
      TELEMETRY_ENABLED: "false"
    ports:
      - "${INFISICAL_HOST_PORT:-8090}:8080"
    depends_on:
      infisical-db:
        condition: service_healthy
      infisical-redis:
        condition: service_healthy

volumes:
  db-data:
  infisical-db-data:
  infisical-redis-data:
